<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="UTF-8" />
    <title>Raaz</title>
    <script>
      const savedTitle = window.history.state?.raazTitle;
      if (savedTitle?.pathname === window.location.pathname && typeof savedTitle.title === 'string') {
        document.title = savedTitle.title;
      } else if (window.location.pathname === '/login') {
        document.title = 'sign in';
      } else if (window.location.pathname === '/signup') {
        document.title = 'sign up';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
