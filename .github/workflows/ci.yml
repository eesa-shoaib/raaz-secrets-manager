name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 26

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w packages/shared-schemas
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build & Shared Schemas
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test -w packages/shared-schemas

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: lint-and-format
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      RECOVERY_MONGO_URI: mongodb://127.0.0.1:27017/raaz_recovery_ci?replicaSet=rs0&directConnection=true
      REQUIRE_TEST_DB: 'true'
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long
      MASTER_KEY: dGVzdC1tYXN0ZXJrZXktdGhhdC1pcy1leGFjdGx5LTMyLWJ5dGVz
      MASTER_KEY_VERSION: 1
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Start MongoDB 8 single-node replica set
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0
          mongodb-port: 27017
      - run: npm ci
      - run: npm run build -w packages/shared-schemas
      - run: npm run build -w server
      - run: npm run test -w server
      - name: Rehearse backup and secret recovery
        run: |
          node server/scripts/rehearse-recovery.mjs --dry-run
          node server/scripts/rehearse-recovery.mjs

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w packages/shared-schemas
      - run: npm run build -w client
      - run: npm run test -w client
