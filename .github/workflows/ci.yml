name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 26

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w packages/shared-schemas
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build & Shared Schemas
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test -w packages/shared-schemas

  test-server:
    name: Test Server
    runs-on: ubuntu-24.04
    needs: lint-and-format
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      RECOVERY_MONGO_URI: mongodb://127.0.0.1:27017/raaz_recovery_ci?replicaSet=rs0&directConnection=true
      REQUIRE_TEST_DB: 'true'
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long
      MASTER_KEY: dGVzdC1tYXN0ZXJrZXktdGhhdC1pcy1leGFjdGx5LTMyLWJ5dGVz
      MASTER_KEY_VERSION: 1
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache MongoDB 8.0.4 binary
        id: cache-mongo
        uses: actions/cache@v4
        with:
          path: /tmp/mongodb-8.0.4
          key: mongodb-ubuntu2404-8.0.4
      - name: Install and start MongoDB 8 single-node replica set
        run: |
          if [ "${{ steps.cache-mongo.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.4.tgz -o /tmp/mongodb.tgz
            mkdir -p /tmp/mongodb-8.0.4
            tar -xzf /tmp/mongodb.tgz --strip-components=1 -C /tmp/mongodb-8.0.4
            rm -f /tmp/mongodb.tgz
          fi
          mkdir -p /tmp/mongo-data
          /tmp/mongodb-8.0.4/bin/mongod \
            --replSet rs0 \
            --bind_ip 127.0.0.1 \
            --port 27017 \
            --dbpath /tmp/mongo-data \
            --fork \
            --logpath /tmp/mongod.log || { cat /tmp/mongod.log; exit 1; }
      - run: npm ci
      - name: Initialize MongoDB replica set
        run: |
          node --input-type=module -e '
            import mongoose from "mongoose";
            const client = await mongoose.mongo.MongoClient.connect("mongodb://127.0.0.1:27017/?directConnection=true");
            try {
              await client.db("admin").command({ replSetInitiate: { _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] } });
            } catch (e) {
              if (!/already initialized/i.test(e.message)) throw e;
            }
            for (let i = 0; i < 30; i++) {
              const status = await client.db("admin").command({ hello: 1 });
              if (status.isWritablePrimary) break;
              await new Promise((r) => setTimeout(r, 500));
            }
            await client.close();
          '
      - run: npm run build -w packages/shared-schemas
      - run: npm run build -w server
      - run: npm run test -w server
      - name: Rehearse backup and secret recovery
        run: |
          node server/scripts/rehearse-recovery.mjs --dry-run
          node server/scripts/rehearse-recovery.mjs

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w packages/shared-schemas
      - run: npm run build -w client
      - run: npm run test -w client
